name: Rust CI/CD

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        components: rustfmt, clippy
        override: true

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: sshm

    - name: Check formatting
      run: cargo fmt --manifest-path sshm/Cargo.toml -- --check

    - name: Run clippy
      run: cargo clippy --manifest-path sshm/Cargo.toml --all-targets --all-features

  # install.sh is served straight from `master`, so a bad merge is live for
  # every user before anyone can release their way out of it — and until
  # `sshm update` ships in a release, it is the only update path that exists
  # at all. The interesting behaviour is also the behaviour that cannot be
  # tested against a real release: what happens when an older binary is
  # already present, shadowing, symlinked, or sitting in a directory the user
  # cannot write. So the smoke test fakes the GitHub API and the tarball and
  # drives every branch offline.
  #
  # This job is worth marking as a required status check on master.
  installer:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install shellcheck
      run: sudo apt-get update && sudo apt-get install -y shellcheck

    - name: Lint install.sh
      run: shellcheck install.sh tests/install/smoke.sh

    - name: Smoke test the update path
      run: ./tests/install/smoke.sh

  test:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: sshm

    - name: Run tests
      run: cargo test --manifest-path sshm/Cargo.toml --all-features

  # The end-to-end suite: the real binary in a real pseudo-terminal, driven with
  # real keystrokes. Everything in `test` above drives the frame through a seam,
  # and the seam cannot see whether a chord arrives as the bytes crossterm
  # decodes or whether the terminal is handed back — both of which are the
  # app's contract with the user.
  #
  # Plain `ubuntu-latest`, with no `container:` on purpose. A container job has
  # no controlling terminal of its own and no guarantee of `/dev/ptmx`, and a PTY
  # test that cannot open a pty does not fail loudly — it fails confusingly, or
  # not at all. The runner image has pty devices; a container inherits whatever
  # the job happened to mount.
  #
  # Worth marking as a required status check on master, like `installer`.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    # The suite itself is a handful of seconds; the bound is for a cold
    # dependency build of the crate and its harness. Roughly twice what a warm
    # run costs, because a job killed by the runner timeout reports nothing.
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          sshm
          sshm-e2e

    - name: Install cargo-nextest
      uses: taiki-e/install-action@cargo-nextest

    # The same script a laptop runs, so the two cannot drift: it builds the
    # binary, points the suite at that binary through SSHM_E2E_BIN, and uses
    # nextest when it is installed. Per-test isolation and the ten-second
    # per-test deadline are in sshm-e2e/.config/nextest.toml, and there are no
    # retries anywhere — a flake is a bug, not a hiccup.
    - name: Run the end-to-end suite
      run: ./sshm-e2e/run-e2e.sh

    # The Shell Widget tests drive real zsh and bash. The runner image ships
    # both; the step asserts it rather than letting a future image change turn
    # a shell test into a skip.
    - name: Check the shells the suite drives are present
      run: command -v zsh && command -v bash

  design:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: sshm

    # Deterministic design rules plus the terminal capability matrix: the detector
    # runs once per colour mode, since ColorSupport::detect() reads the
    # environment. The script unsets NO_COLOR for the colour passes on purpose —
    # a non-interactive shell carries NO_COLOR=1/TERM=dumb, which would otherwise
    # make every pass silently monochrome and the matrix prove nothing.
    - name: Terminal capability matrix
      run: ./scripts/design-matrix.sh

    - name: Upload frames for review
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: design-frames
        path: sshm/target/design-frames/
        if-no-files-found: warn

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        override: true

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Install cargo-crap
      uses: taiki-e/install-action@cargo-crap

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: sshm

    - name: Generate coverage with 80% threshold
      run: |
        cargo llvm-cov --manifest-path sshm/Cargo.toml --all-features \
          --fail-under-lines 80 \
          --fail-under-functions 80 \
          --lcov --output-path lcov.info

    # CRAP = CC² × (1 − coverage)³ + CC, so this flags the functions that are
    # complex *and* untested — the ones a change can break with no test failing.
    # The threshold and --fail-above live in sshm/.cargo-crap.toml, so the
    # local gate in sshm/coverage.sh and this one can never drift apart.
    # Run from sshm/ so the default tests/** excludes match; the lcov paths are
    # absolute, so cargo-crap matches them against ./src by suffix either way.
    - name: CRAP gate
      working-directory: sshm
      run: cargo crap --lcov ../lcov.info

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: lcov.info

  security:
    needs: check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install cargo-audit
      uses: taiki-e/install-action@cargo-audit

    # The advisories ignored below are all in *transitive* dependencies of
    # `self-github-update-enhanced` (the only published self-update crate
    # available for this target). We cannot upgrade them directly:
    #
    #   - quick-xml 0.3.1 (RUSTSEC-2026-0194, RUSTSEC-2026-0195): pinned by
    #     self-github-update-enhanced 0.39.2; quick-xml 0.41+ is API-
    #     incompatible. Exposure limited to parsing GitHub release metadata.
    #   - number_prefix 0.4.0 (RUSTSEC-2025-0119): unmaintained, pulled by
    #     `indicatif` <- self-github-update-enhanced. No fixed version exists.
    #
    # Remove these ignores once self-github-update-enhanced releases a version
    # that bumps quick-xml/indicatif.
    - name: Security audit
      working-directory: sshm
      run: |
        cargo audit \
          --ignore RUSTSEC-2026-0195 \
          --ignore RUSTSEC-2026-0194 \
          --ignore RUSTSEC-2025-0119

  # Both musl targets, because Termux reports `Linux`/`aarch64` and an
  # installer that answers every Linux with the x86_64 triple ships an
  # unrunnable binary there (#48). x86_64 keeps its native musl-tools
  # toolchain; aarch64 cross-compiles with zig, because `ring`'s C/asm
  # needs a cross C compiler and `cargo zigbuild` wraps exactly that.
  # The per-target commands live in the matrix itself — one place says how
  # each target is built, stripped, and run, instead of the same
  # `if target == aarch64` question asked three times.
  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, coverage, security]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            build: cargo build
            strip: strip
            run: ""
          - target: aarch64-unknown-linux-musl
            build: cargo zigbuild
            strip: aarch64-linux-gnu-strip
            run: qemu-aarch64-static
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        target: ${{ matrix.target }}
        override: true

    - name: Install musl tools
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: sudo apt-get update && sudo apt-get install -y musl-tools

    - name: Install cross tools
      if: matrix.target == 'aarch64-unknown-linux-musl'
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-user-static binutils-aarch64-linux-gnu
        # Zig is pinned, not tracked: the snap ships only a drifting beta
        # channel, and a release-critical cross C compiler must not move
        # underneath the recipe verified against it. 0.16.0 is what the
        # #48 build was checked with; the checksum is the one
        # ziglang.org publishes for this exact tarball.
        curl -sL --retry 3 -o /tmp/zig.tar.xz \
          https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        echo "70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  /tmp/zig.tar.xz" | sha256sum -c -
        sudo tar -xJf /tmp/zig.tar.xz -C /opt
        echo "/opt/zig-x86_64-linux-0.16.0" >> "$GITHUB_PATH"
      shell: bash

    - name: Install cargo-zigbuild
      if: matrix.target == 'aarch64-unknown-linux-musl'
      uses: taiki-e/install-action@cargo-zigbuild

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: sshm

    - name: Build release
      run: ${{ matrix.build }} --release --target ${{ matrix.target }} --manifest-path sshm/Cargo.toml

    - name: Strip binary
      run: ${{ matrix.strip }} sshm/target/${{ matrix.target }}/release/sshm

    - name: Get version from Cargo.toml
      id: cargo_version
      run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' sshm/Cargo.toml)" >> $GITHUB_OUTPUT

    # The cross-compiled artifact is not trusted because it compiled; it is
    # trusted because it ran — under aarch64 emulation, printing the
    # version the manifest says. The x86_64 leg gets the same check
    # natively, so a silent misbuild fails here rather than on a user's
    # machine (#48's acceptance gate).
    - name: Verify the binary runs
      run: |
        bin=sshm/target/${{ matrix.target }}/release/sshm
        out=$(${{ matrix.run }} "$bin" --version)
        if [ "$out" != "sshm ${{ steps.cargo_version.outputs.version }}" ]; then
          echo "expected 'sshm ${{ steps.cargo_version.outputs.version }}', got '$out'"
          exit 1
        fi
        file "$bin"

    - name: Create tarball
      run: |
        cd sshm/target/${{ matrix.target }}/release
        tar czvf ../../../../sshm-v${{ steps.cargo_version.outputs.version }}-${{ matrix.target }}.tar.gz sshm

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sshm-linux-${{ matrix.target }}
        path: sshm-v${{ steps.cargo_version.outputs.version }}-${{ matrix.target }}.tar.gz

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, coverage, security]
    runs-on: macos-latest
    strategy:
      matrix:
        target: [x86_64-apple-darwin, aarch64-apple-darwin]
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        target: ${{ matrix.target }}
        override: true

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: sshm

    - name: Build release
      run: cargo build --release --target ${{ matrix.target }} --manifest-path sshm/Cargo.toml

    - name: Get version from Cargo.toml
      id: cargo_version
      run: echo "version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' sshm/Cargo.toml)" >> $GITHUB_OUTPUT

    - name: Create tarball
      run: |
        cd sshm/target/${{ matrix.target }}/release
        tar czvf ../../../../sshm-v${{ steps.cargo_version.outputs.version }}-${{ matrix.target }}.tar.gz sshm

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sshm-macos-${{ matrix.target }}
        path: sshm-v${{ steps.cargo_version.outputs.version }}-${{ matrix.target }}.tar.gz

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, coverage, security]
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: actions-rs/toolchain@v1
      with:
        profile: minimal
        toolchain: stable
        target: x86_64-pc-windows-msvc
        override: true

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: sshm

    - name: Build release
      run: cargo build --release --target x86_64-pc-windows-msvc --manifest-path sshm/Cargo.toml

    - name: Get version from Cargo.toml
      id: cargo_version
      # Anchored, exactly like the sed the Linux and macOS jobs use. Unanchored,
      # this matched every `version = "…"` line in the manifest and concatenated
      # the whole dependency list into the asset name: v0.1.12 published
      # `sshm-v0.1.12.1.0.1.0.0.39.0.12.4.5-x86_64-pc-windows-msvc.zip`, which
      # nothing can find (#46).
      run: |
        $version = (Select-String -Path sshm/Cargo.toml -Pattern '^version = "([^"]+)"' -CaseSensitive | Select-Object -First 1).Matches.Groups[1].Value
        echo "version=$version" >> $env:GITHUB_OUTPUT
      shell: pwsh

    - name: Create zip archive
      run: |
        cd sshm/target/x86_64-pc-windows-msvc/release
        $version = "${{ steps.cargo_version.outputs.version }}"
        $dest = "../../../../sshm-v${version}-x86_64-pc-windows-msvc.zip"
        Compress-Archive -Path sshm.exe -DestinationPath $dest
      shell: pwsh

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: sshm-windows
        path: sshm-v${{ steps.cargo_version.outputs.version }}-x86_64-pc-windows-msvc.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: List artifacts
      run: ls -la artifacts/

    - name: Create release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/sshm-linux-*/*.tar.gz
          artifacts/sshm-macos-*/*.tar.gz
          artifacts/sshm-windows/*.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
