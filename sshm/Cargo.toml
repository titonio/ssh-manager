[package]
name = "sshm"
version = "0.1.13"
edition = "2021"

[dependencies]
ratatui = "0.30"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
fuzzy-matcher = "0.3"
# Display width in terminal columns, not characters. The inline frame's
# row-count invariant is counted in columns; `chars().count()` is not.
unicode-width = "0.2"
uuid = { version = "1.0", features = ["v4"] }
# The whole of Apply Update (#46): release selection, download, extraction and
# the in-place swap. `archive-tar` alone is not enough — our release assets are
# `.tar.gz`, and without `compression-flate2` the crate hands the gzip stream to
# the tar reader undecoded, so every update would fail at extraction.
#
# There is deliberately no `reqwest` here any more. The crate pulls its own with
# `default-features = false, features = ["rustls-tls"]`, so the TLS stack is
# enforced by the crate rather than by a feature we might forget to keep.
self-github-update-enhanced = { version = "0.39", features = ["archive-tar", "archive-zip", "compression-flate2"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"





[dev-dependencies]
tempfile = "3.8"
insta = "1.34"
serial_test = "3.4.0"
